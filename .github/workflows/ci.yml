name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly dependency audit (SEC-9). Runs on the default branch only.
    - cron: "17 3 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Everything the IdP runs is executed by Bun; Node is only here for CI tooling.
  BUN_VERSION: "1.3.12"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # Static checks — the fast gate every pull request has to clear first.
  # ---------------------------------------------------------------------------
  check:
    if: github.event_name != 'schedule'
    name: lint · typecheck · unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Refuse floating dependency ranges (SEC-9)
        # Every dependency is pinned exactly; `latest` and `^`/`~` ranges are how
        # a supply-chain change sneaks into a release.
        run: bun run scripts/check-pinned-deps.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Config JSON Schemas are up to date (CFG-1)
        run: pnpm --filter web run config:schemas -- --check

      - name: Database schema has not drifted (DM-1)
        # Regenerates from the installed Better Auth and fails on any
        # difference, so the committed migrations can never describe a schema
        # the running code does not expect.
        run: pnpm --filter web run db:generate-schema -- --check

      - name: Build
        run: pnpm --filter web run build

      - name: The server has not leaked into the browser bundle
        # A route `loader` runs on the client too, so one careless import puts
        # Better Auth, Drizzle and the `postgres` driver in the browser — which
        # is what broke hydration outright until it was caught.
        run: bun run scripts/check-client-bundle.ts

  # ---------------------------------------------------------------------------
  # Integration tests against a real Postgres (TST-1).
  #
  # A service container is a *direct* connection, never a transaction pooler,
  # so the session advisory locks these tests assert actually hold (S4, D27).
  # `localhost` also means the config's SSL default resolves to `disable`, so
  # no certificate wrangling is needed.
  # ---------------------------------------------------------------------------
  integration:
    if: github.event_name != 'schedule'
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: idp
          POSTGRES_PASSWORD: idp
          POSTGRES_DB: idp
        ports:
          - 5432:5432
        # Without this the first test can connect before Postgres is ready and
        # fail for a reason that has nothing to do with the code.
        options: >-
          --health-cmd "pg_isready -U idp -d idp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://idp:idp@localhost:5432/idp

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Integration tests + coverage thresholds (TST-1)
        # `test:coverage` runs *both* projects. Measuring `src/server` against
        # the unit project alone was the wrong denominator — the database
        # layer and the auth hooks are exercised by integration tests by
        # design — so the thresholds reported ~60 % and failed their own gate.
        # Nothing noticed, because no job ran coverage at all.
        run: pnpm --filter web run test:coverage

  # ---------------------------------------------------------------------------
  # Nightly dependency audit (SEC-9).
  # ---------------------------------------------------------------------------
  audit:
    if: github.event_name == 'schedule'
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate
