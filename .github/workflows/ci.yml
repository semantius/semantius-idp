name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly dependency audit. Runs on the default branch only.
    - cron: "17 3 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The token is read-only for every job unless the job widens it.
# Two do: `docker` below and `image` in release.yml, each to exactly what it
# uploads or pushes. A job that needs nothing says nothing and gets nothing.
permissions:
  contents: read

env:
  # Everything the IdP runs is executed by Bun; Node is only here for CI tooling.
  BUN_VERSION: "1.3.12"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # Static checks — the fast gate every pull request has to clear first.
  # ---------------------------------------------------------------------------
  check:
    if: github.event_name != 'schedule'
    name: lint · typecheck · unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Refuse floating dependency ranges and unpinned actions
        # Every dependency is pinned exactly; `latest` and `^`/`~` ranges are how
        # a supply-chain change sneaks into a release. Every `uses:` in these
        # workflows is pinned to a commit SHA for the same reason: a tag is a
        # pointer somebody else can move or delete.
        run: bun run scripts/check-pinned-deps.ts

      - name: Bun is pinned to one version everywhere
        # Bun is the *runtime*, not a build tool: the image is
        # `oven/bun:<version>-slim` with Bun as PID 1, and on arm64 that is a
        # different binary from the one this job runs. Five files carry the
        # version and nothing compared them until a release workflow added the
        # fifth copy by hand.
        run: bun run scripts/check-bun-version.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Config JSON Schemas are up to date
        run: pnpm --filter web run config:schemas -- --check

      - name: The shipped example configuration validates
        # config.example/ is what the quick start tells an operator to copy.
        # It is validated here so it cannot rot into a folder that does not
        # load — the placeholders are given throwaway values because that is
        # exactly what the operator supplies next.
        env:
          IDP_CONFIG_DIR: config.example
          DATABASE_URL: postgres://idp@localhost:5432/idp
          IDP_SECRET: ci-example-secret-of-at-least-32-chars
          EXAMPLE_WEB_CLIENT_SECRET: ci-example-client-secret-32-chars-x
          EXAMPLE_FIRSTPARTY_CLIENT_SECRET: ci-example-client-secret-32-chars-y
        run: bun apps/web/src/cli/index.ts config validate

      - name: The configuration reference is up to date
        # Generated from the same zod schemas the loader validates against, so
        # a default can never change without the documentation following it.
        run: pnpm --filter web run docs:config -- --check

      - name: Database schema has not drifted
        # Regenerates from the installed Better Auth and fails on any
        # difference, so the committed migrations can never describe a schema
        # the running code does not expect.
        run: pnpm --filter web run db:generate-schema -- --check

      - name: Build
        run: pnpm --filter web run build

      - name: The server has not leaked into the browser bundle
        # A route `loader` runs on the client too, so one careless import puts
        # Better Auth, Drizzle and the `postgres` driver in the browser — which
        # is what broke hydration outright until it was caught.
        run: bun run scripts/check-client-bundle.ts

  # ---------------------------------------------------------------------------
  # Integration tests against a real Postgres.
  #
  # A service container is a *direct* connection, never a transaction pooler,
  # so the session advisory locks these tests assert actually hold.
  # `localhost` also means the config's SSL default resolves to `disable`, so
  # no certificate wrangling is needed.
  # ---------------------------------------------------------------------------
  integration:
    if: github.event_name != 'schedule'
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: idp
          POSTGRES_PASSWORD: idp
          POSTGRES_DB: idp
        ports:
          - 5432:5432
        # Without this the first test can connect before Postgres is ready and
        # fail for a reason that has nothing to do with the code.
        options: >-
          --health-cmd "pg_isready -U idp -d idp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://idp:idp@localhost:5432/idp
      # Explicit, so `scripts/test-database.ts` hands straight over to the
      # service container above instead of starting one of its own. Locally
      # the variable is unset and the script starts a throwaway Postgres,
      # because the alternative — the deployment's hosted database, ~102 ms
      # away — is what made this suite take fifty-four minutes.
      IDP_TEST_DATABASE_URL: postgres://idp:idp@localhost:5432/idp

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Integration tests + coverage thresholds
        # `test:coverage` runs *both* projects. Measuring `src/server` against
        # the unit project alone was the wrong denominator — the database
        # layer and the auth hooks are exercised by integration tests by
        # design — so the thresholds reported ~60 % and failed their own gate.
        # Nothing noticed, because no job ran coverage at all.
        run: pnpm --filter web run test:coverage

  # ---------------------------------------------------------------------------
  # End-to-end, in a browser, against the built image.
  #
  # The class of defect this exists for is the one that survives every other
  # gate: markup that is correct and a page that is nevertheless unusable. The
  # sign-in page shipped with no stylesheet for four milestones because every
  # gate in this repository read HTML, and the HTML was perfect.
  #
  # Both deployment shapes run, because the sub-path one is a different
  # application as far as every URL is concerned: a wrong
  # cookie `Path`, a stripped prefix or a missing origin-root RFC 8414 route
  # only shows up when a browser drives it.
  #
  # It builds its own image rather than waiting for the `docker` job, so the
  # two run in parallel; the layer cache is shared, and `docker` is the job
  # that writes it.
  # ---------------------------------------------------------------------------
  e2e:
    if: github.event_name != 'schedule'
    name: e2e · host root + sub-path
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [check]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build the image the suite drives
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: semantius-idp:e2e
          build-args: |
            IDP_VERSION=0.0.0-e2e
            IDP_REVISION=${{ github.sha }}
          # Read-only: the `docker` job owns this cache.
          cache-from: type=gha

      - name: Browsers
        # `--with-deps` because a bare runner has none of the shared libraries
        # Chromium needs, and the failure otherwise is a linker error inside a
        # browser nobody can see.
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: End-to-end
        env:
          IDP_IMAGE: semantius-idp:e2e
        run: pnpm --filter web run test:e2e

      - name: Report
        # Traces, screenshots and video for the run that failed — retained only
        # then, because a green run should leave nothing behind.
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The image, and the only test that exercises it.
  #
  # Everything above tests the application. This tests the artifact: that what
  # would be published starts, migrates, serves the protocol, signs somebody in
  # and stops when told. A missing file in the final stage, a signal that never
  # reaches PID 1, a health check probing the wrong path — none of those are
  # visible to a unit or integration test, and all three are the sort of thing
  # that is only ever found in production.
  #
  # amd64 only, and nothing is published: arm64 is emulated here and would
  # roughly triple the build for an artifact nobody merges. Both architectures
  # and the registry belong to `release.yml`, which is the workflow a tag
  # actually triggers — this one never sees a tag, because it filters on
  # branches.
  # ---------------------------------------------------------------------------
  docker:
    if: github.event_name != 'schedule'
    name: image · smoke · scan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [check]
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The OCI `revision` label wants the real commit, and a shallow
          # checkout of a PR merge commit is not it.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # This is also the job that writes the layer cache the `e2e` job and
      # `release.yml` read.
      - name: Build (amd64, loaded locally)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: semantius-idp:ci
          build-args: |
            IDP_VERSION=0.0.0-ci
            IDP_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Smoke test
        env:
          IDP_IMAGE: semantius-idp:ci
        run: bun run scripts/smoke-test.ts

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: semantius-idp:ci
          format: sarif
          output: trivy.sarif
          # The scan reports; it does not gate. A base-image CVE with no fix
          # available would otherwise block every merge until somebody else
          # shipped a patch, and a gate people learn to bypass is worse than a
          # report people read.
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload scan results
        # Guarded on the file existing: if an earlier step fails Trivy never
        # runs, and an unguarded upload turns one failure into two and buries
        # the real one.
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: semantius-idp:ci
          format: spdx-json
          artifact-name: sbom.spdx.json

      # Nothing is pushed from here. A merge to `main` builds and smokes the
      # image; the release's tag set is a release act, and `release.yml` performs it.
      # The steps that used to sit at this point were guarded on
      # `refs/tags/v*`, which this workflow's `on:` block cannot produce — a
      # publish path that had never once executed.

  # ---------------------------------------------------------------------------
  # Nightly dependency audit.
  # ---------------------------------------------------------------------------
  audit:
    if: github.event_name == 'schedule'
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate
