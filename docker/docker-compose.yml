# The reference deployment (OPS-7, D51).
#
# Everything here runs **from this folder**, because compose resolves every
# relative path in the file against the file's own directory, and the
# interpolation `.env` against the directory it is invoked from:
#
#   cd docker
#   docker compose --env-file ../.env up -d
#
# The `idp-*` scripts next to this file do exactly that, and are the documented
# way in (`./idp-create.sh`, `idp-create.cmd`).
#
# Before the first run:
#
#   cp .env.example .env          # then fill in every value it asks for
#   cp -r config.example config   # the annotated defaults; edit to taste
#
# — both at the *repository root*, one level up. `idp-create` does the first
# for you.
#
# `config/` is bind-mounted **read-only**: the container never writes to its own
# configuration, and CFG-1's "restart to apply" is a property of the mount
# rather than a promise in the documentation.
#
# **Where the database connection lives (D48).** `.env` holds whole connection
# strings — `DATABASE_URL`, and `DATABASE_URL_ADMIN` when the first one goes
# through a transaction pooler — and this file passes them through `env_file`
# unchanged. It does not assemble a URL out of a password, and there is no
# secrets file to keep in step with one: an operator pointing `DATABASE_URL` at
# a hosted Postgres should not also have to satisfy a bundled database they are
# not using. `POSTGRES_PASSWORD` below is a knob of the bundled reference
# database only, and it defaults, so it is one fewer thing a first run has to
# know.

name: semantius-idp

services:
  postgres:
    # Pinned to a minor, because "17" would silently become 17.6 on a `pull` and
    # a major upgrade is a data-directory migration nobody asked for.
    image: postgres:17.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: idp
      # Optional and defaulted (D48). This database is `expose:`-only — it is
      # reachable from the compose network and nowhere else — so a shipped
      # default is a starting point rather than an exposure. Hardening it means
      # changing this *and* the password inside `DATABASE_URL`, which is the one
      # place the application reads.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idp}
      POSTGRES_DB: idp
      # Postgres wants a locale at initdb time and never again; setting it here
      # keeps `initdb` from picking one up from the host.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `-U idp -d idp` and not a bare `pg_isready`: the default checks that
      # *a* server answers, which is already true while `initdb` is still
      # running against a different socket.
      test: ["CMD-SHELL", "pg_isready -U idp -d idp"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    # Not published. Nothing outside this network needs the database, and a
    # `5432:5432` in a reference file is how a development Postgres ends up on
    # the internet.
    expose:
      - "5432"

  idp:
    image: ${IDP_IMAGE:-ghcr.io/semantius/semantius-idp:latest}
    build:
      # The build context is the repository root — the image needs the whole
      # workspace — while the Dockerfile lives here. BuildKit reads its ignore
      # list from `<dockerfile>.dockerignore` when that file exists, which is
      # why the one next to it is called `Dockerfile.dockerignore`.
      context: ..
      dockerfile: docker/Dockerfile
      args:
        IDP_VERSION: ${IDP_VERSION:-0.0.0-dev}
        IDP_REVISION: ${IDP_REVISION:-}
    restart: unless-stopped
    depends_on:
      postgres:
        # Not `depends_on: [postgres]`, which only waits for the *container* to
        # start: the IdP migrates on boot, and a migration against a Postgres
        # that is still initialising fails the whole start-up (OPS-2).
        condition: service_healthy
    env_file:
      # **This is how the database URLs reach the container** (D48), and the
      # reason they are not in `environment:` below: a value read from
      # `env_file` cannot be overridden by whatever happens to be exported in
      # the shell that ran `docker compose`, so a host `DATABASE_URL` pointing
      # at somebody's production database can no longer walk into the stack —
      # which is the protection D43 asked for, kept while the variable moved.
      #
      # The path is a variable so a test can hand a whole stack a generated
      # environment file without touching the operator's; optional, because a
      # first `docker compose config` before `.env` exists should describe the
      # stack rather than fail.
      - path: ${IDP_ENV_FILE:-../.env}
        required: false
    environment:
      # **Pinned here, and not merely defaulted in the image.** `environment`
      # wins over `env_file`, and a developer's `.env` says
      # `IDP_CONFIG_DIR=./config` — a *host* path. Passed through, the container
      # looks for its configuration at a directory that does not exist inside
      # it and dies on every restart with "Required file not found at
      # C:/…/config/config.json", which is a genuinely baffling thing to read
      # in a container log. `/config` is where the volume below is mounted, and
      # it is not negotiable.
      IDP_CONFIG_DIR: /config

      # Likewise: a host `.env` that names a throwaway schema must not decide
      # where a container puts its tables.
      IDP_SCHEMA_NAME: ${IDP_SCHEMA_NAME:-idp}
      #
      # The other bootstrap variables (`HOST`, `PORT`, `LOG_LEVEL`,
      # `IDP_MIGRATE_ON_BOOT`) need no pin: each applies only when the config
      # file leaves the setting out, and the shipped `config.example` sets all
      # of them. The two above are pinned because each decides *which
      # configuration* or *which schema* — the answers where a stray host value
      # is not a wrong setting but the wrong deployment.
      IDP_BASE_URL: ${IDP_BASE_URL:-http://localhost:3000}
      # OPS-3: the health check has to know the mount path, because under a
      # sub-path `/healthz` is at `/idp/healthz` and a probe of the origin root
      # would report a healthy container as failing.
      IDP_HEALTH_URL: http://127.0.0.1:3000${IDP_BASE_PATH:-}/healthz
    volumes:
      # The path is a variable so the TST-8 smoke test can point a whole stack
      # at a generated config folder without touching the operator's. The
      # default is `../config` because this file lives in `docker/` and the
      # config folder does not.
      - ${IDP_CONFIG_HOST_DIR:-../config}:/config:ro
    ports:
      - "${IDP_PORT:-3000}:3000"
    # OPS-1: nothing writes to the image. The application needs exactly one
    # writable path, and it is a tmpfs rather than a volume — what goes there
    # is scratch, and it should not survive a restart.
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # OPS-4: the drain is bounded by `server.shutdownTimeoutSeconds` (10 s by
    # default), and this has to be longer or Docker kills the process in the
    # middle of the thing that exists to avoid being killed in the middle.
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch(process.env.IDP_HEALTH_URL); process.exit(r.ok ? 0 : 1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  # `--profile caddy`. Automatic HTTPS in front of the IdP (OPS-7, OPS-9).
  # Without the profile this service does not start and the IdP is reachable
  # on ${IDP_PORT} directly, which is what a local run wants.
  #
  # Caddy is **never in the image** — it is this optional service and nothing
  # else. Of the test suites only the Playwright sub-path project brings it up,
  # because OPS-10 is a different deployment as far as every URL is concerned;
  # unit, integration and the TST-8 smoke test all run without it.
  caddy:
    image: caddy:2.10-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      idp:
        condition: service_healthy
    environment:
      # The hostname Caddy gets a certificate for. `localhost` makes it issue
      # an internal one, which is right for a local trial and wrong for
      # anything else.
      IDP_DOMAIN: ${IDP_DOMAIN:-localhost}
    volumes:
      # Swap for `./Caddyfile.subpath` to serve the IdP at `/idp` on a domain
      # that already hosts something else (OPS-10).
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

volumes:
  pgdata:
  caddy_data:
  caddy_config:
